services:
  - type: web
    name: obrasegura-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-luna
      - key: CORS_ORIGIN
        value: '*'
